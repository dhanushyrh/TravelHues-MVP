version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: travelhues-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: travelhues
      POSTGRES_PASSWORD: travelhues_secret
      POSTGRES_DB: travelhues_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U travelhues -d travelhues_db']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - travelhues

  redis:
    image: redis:7-alpine
    container_name: travelhues-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - travelhues

  minio:
    image: minio/minio:latest
    container_name: travelhues-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - travelhues

  minio-setup:
    image: minio/mc:latest
    container_name: travelhues-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin123;
      mc mb --ignore-existing local/travelhues;
      mc anonymous set download local/travelhues;
      echo 'MinIO bucket ready';
      "
    networks:
      - travelhues

  mailhog:
    image: mailhog/mailhog:latest
    container_name: travelhues-mailhog
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'
    networks:
      - travelhues

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: travelhues-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      APP_PORT: 3000
      APP_ENV: development
      APP_URL: http://localhost:3000
      FRONTEND_URL: http://localhost:3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: travelhues
      DB_PASSWORD: travelhues_secret
      DB_DATABASE: travelhues_db
      DB_SYNCHRONIZE: 'true'
      DB_LOGGING: 'true'
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: dev_jwt_secret_change_in_production
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: dev_refresh_secret_change_in_production
      JWT_REFRESH_EXPIRES_IN: 7d
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: travelhues
      MINIO_USE_SSL: 'false'
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MAIL_FROM: noreply@travelhues.com
    ports:
      - '3000:3000'
    volumes:
      - ./backend/src:/app/src
      - ./backend/package.json:/app/package.json
    networks:
      - travelhues

  creator-web:
    build:
      context: ./creator-web
      dockerfile: Dockerfile
      target: development
    container_name: travelhues-creator-web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:3000/api/v1
    ports:
      - '3001:3001'
    volumes:
      - ./creator-web/src:/app/src
      - ./creator-web/public:/app/public
      - ./creator-web/index.html:/app/index.html
      - ./creator-web/package.json:/app/package.json
    networks:
      - travelhues

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: travelhues-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@travelhues.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - '5050:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - travelhues

volumes:
  postgres_data:
  redis_data:
  minio_data:
  pgadmin_data:

networks:
  travelhues:
    driver: bridge
